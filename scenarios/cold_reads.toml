[meta]
name = "Cold Reads"
description = "Write and read a mixed page set — highlights first-read materialization and follow-up cache hits"

[[steps]]
op = "repeat"
count = 40
steps = [
    { op = "put", page_id = 1, offset = 0, data = "cold-data-1" },
    { op = "put", page_id = 2, offset = 0, data = "cold-data-2" },
    { op = "put", page_id = 3, offset = 0, data = "cold-data-3" },
]

[[steps]]
op = "put"
page_id = 4
offset = 0
data = "page-four"

[[steps]]
op = "put"
page_id = 5
offset = 0
data = "page-five"

[[steps]]
op = "put"
page_id = 6
offset = 0
data = "page-six"

[[steps]]
op = "put"
page_id = 7
offset = 0
data = "page-seven"

[[steps]]
op = "put"
page_id = 8
offset = 0
data = "page-eight"

[[steps]]
op = "put"
page_id = 9
offset = 0
data = "page-nine"

[[steps]]
op = "put"
page_id = 10
offset = 0
data = "page-ten"

[[steps]]
op = "refresh"

# Read all written pages — first reads are cache misses, triggering materialization
[[steps]]
op = "repeat"
count = 10
steps = [
    { op = "get", page_id = 1 },
]

[[steps]]
op = "get"
page_id = 2

[[steps]]
op = "get"
page_id = 3

[[steps]]
op = "get"
page_id = 4

[[steps]]
op = "get"
page_id = 5

[[steps]]
op = "get"
page_id = 6

[[steps]]
op = "get"
page_id = 7

[[steps]]
op = "get"
page_id = 8

[[steps]]
op = "get"
page_id = 9

[[steps]]
op = "get"
page_id = 10

# Read them again — should hit the cache
[[steps]]
op = "get"
page_id = 1

[[steps]]
op = "get"
page_id = 2

[[steps]]
op = "get"
page_id = 3
